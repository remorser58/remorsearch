<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>focus fixture 2</title>
<!--
  Focus probe, click-target and layer fixture (driver self-test), desktop-1920:
  - #tick-btn has no focus indicator and a counter inside that ticks: the probe must not
    count the tick as an indicator (unfocused captures before and after).
  - #menu2 is a menu that manages its own focus: the probe before a click on #mi-2 is
    skipped (managed_focus) and the click still lands.
  - #fb is a web component whose button lives in its shadow root; #card-img is the image
    of a card whose link the keyboard reaches; #fake-radio is a role-less div with a
    hidden input only; #cb-l is a custom checkbox whose look never changes (a toggled
    checkbox fires input events, which are not feedback by themselves).
  - #disc opens right after #disc-btn in document order: the next Tab reaches it.
  - #mui-root is a fixed overlay root that takes focus itself (tabindex=-1) around the
    #mui-paper dialog (MUI's pattern): focus counts as inside the dialog.
  - #late-dlg opens at once and moves focus in after 600 ms (an entrance transition).
  - #pair-a and #pair-b sit in one small group with a :focus ring: after a click on
    #pair-a (its ring stays), the probe of #pair-b must still see #pair-b's ring.
  - #card2 is a clickable card whose only controls are side actions (wishlist, cart):
    its image is not covered by them. #dock is a fixed bar holding a menu button and the
    modal drawer it opens; focus left on the button is not inside the drawer.
  - #pulse-btn has no ring and a background that keeps pulsing: the probe cannot tell,
    so it is inconclusive. #ac has suggestions (aria-autocomplete): a click after typing
    in it is not probed (the blur would hide the suggestions).
  - #wi-btn hides its ring in "mouse" modality set by a what-input-like script that
    ignores modifier keys: the probe must still see the ring a keyboard user gets. The
    probe's key press switches the script to keyboard; the driver puts the root's
    attributes back, so the next click's switch back to mouse writes the value the
    attribute already has, which is not feedback (the #cb-l check would fail if it
    counted).
  - #fill-btn fills the focused #fill field by script (value property): feedback.
  - #dead-btn does nothing: its click must show no feedback, although after typing the
    modality script switches the root's marker from keyboard to mouse at mousedown
    (root attributes are page-state markers, not a response).
-->
<style>
  body { margin: 0; font-family: sans-serif; }
  .row { position: absolute; left: 20px; display: flex; gap: 16px; align-items: center; }
  #tick-btn:focus, #tick-btn:focus-visible { outline: none; }
  #menu2 { position: absolute; left: 150px; top: 60px; margin: 0; padding: 4px; list-style: none; background: #fff; border: 1px solid #999; }
  #menu2 li { padding: 4px 12px; }
  #card { position: absolute; left: 20px; top: 120px; width: 300px; height: 200px; border: 1px solid #ccc; cursor: pointer; }
  #card-img { height: 100px; background: #ddd; }
  #card.on { border-color: #1a73e8; }
  #fake-radio, #cb-l { display: inline-block; padding: 6px 10px; border: 1px solid #999; cursor: pointer; }
  #cb { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box { display: inline-block; width: 14px; height: 14px; border: 1px solid #333; vertical-align: middle; }
  #disc-btn { position: absolute; left: 20px; top: 360px; }
  #disc { position: absolute; left: 0; top: 400px; width: 100%; height: 520px; background: #fff; border-top: 2px solid #333; }
  #under { position: absolute; left: 20px; top: 420px; width: 90%; }
  #under p { margin: 0 0 60px; }
  #mui-scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); }
  #mui-root { position: fixed; inset: 0; z-index: 10; }
  #mui-paper { position: absolute; left: 30%; top: 20%; width: 40%; height: 40%; background: #fff; }
  #late-dlg { position: fixed; left: 35%; top: 25%; width: 30%; height: 30%; background: #fff; border: 1px solid #333; z-index: 10; }
  #card2 { position: absolute; left: 360px; top: 120px; width: 260px; height: 200px; border: 1px solid #ccc; cursor: pointer; }
  #card2-img { height: 110px; background: #cde; }
  #dock { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: #eee; z-index: 5; }
  #dock-drawer { position: fixed; left: 0; top: 0; width: 60%; height: 100%; background: #fff; border-right: 1px solid #333; }
  @keyframes pulse { 0% { background: #ffd43b; } 50% { background: #ff922b; } 100% { background: #ffd43b; } }
  #pulse-btn { animation: pulse 0.5s linear infinite; border: 0; height: 40px; padding: 0 16px; }
  #pulse-btn:focus { outline: none; }
  #pair { display: inline-flex; gap: 12px; }
  #pair button { height: 44px; padding: 0 16px; border: 2px solid #1d4ed8; border-radius: 8px; background: #fff; }
  #pair button:focus { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  #wi-btn:focus { outline: 3px solid #1a73e8; outline-offset: 2px; }
  [data-whatinput="mouse"] #wi-btn:focus { outline: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="row" style="top: 20px">
  <button id="tick-btn" type="button">남은 <span id="tick-n">0</span>초</button>
  <button id="menu2-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu2">편집</button>
  <fancy-button id="fb"></fancy-button>
  <div id="fake-radio"><input type="hidden" name="plan" value="basic"><span>기본 요금제</span></div>
  <label id="cb-l"><input type="checkbox" id="cb"><span class="box"></span> 약관 동의</label>
  <button id="mui-btn" type="button">공유 설정</button>
  <button id="late-btn" type="button">이름 바꾸기</button>
  <button id="wi-btn" type="button">저장</button>
</div>
<div id="card2"><div id="card2-img"></div><p style="margin: 4px">무선 충전기</p><button id="card2-wish" type="button">찜</button> <button id="card2-cart" type="button">담기</button></div>
<div class="row" style="top: 70px; left: 1100px"><input id="fill" aria-label="금액"><button id="fill-btn" type="button">+1만</button><button id="dead-btn" type="button">응답 없음</button></div>
<div class="row" style="top: 70px; left: 700px"><button id="pulse-btn" type="button">지금 구매</button><input id="ac" aria-label="검색어" aria-autocomplete="list"><button id="ac-go" type="button">검색</button></div>
<div id="dock"><button id="dock-btn" type="button">메뉴</button>
  <div id="dock-drawer" role="dialog" aria-modal="true" aria-label="메뉴" hidden><a href="#home">홈</a> <button id="dock-close" type="button">닫기</button></div></div>
<div class="row" style="top: 330px; left: 400px"><div id="pair"><button id="pair-a" type="button">임시 저장</button><button id="pair-b" type="button">답안 제출</button></div></div>
<ul id="menu2" role="menu" hidden><li role="menuitem" tabindex="-1" id="mi-1">복사</li><li role="menuitem" tabindex="-1" id="mi-2">붙여넣기</li></ul>
<div id="card"><div id="card-img"></div><h3 style="margin: 4px"><a id="card-link" href="#p1">무선 이어폰</a></h3><p style="margin: 4px">12,000원</p></div>
<div id="under"><p>배송 안내 첫 문단</p><p><button id="under-btn" type="button">배송 조회</button></p><p>배송 안내 셋째 문단</p></div>
<button id="disc-btn" type="button">전체 메뉴</button>
<div id="disc" hidden><a id="disc-a1" href="#x">공지사항</a> <a id="disc-a2" href="#y">이벤트</a></div>
<div id="mui-root" tabindex="-1" hidden><div id="mui-scrim"></div>
  <div id="mui-paper" role="dialog" aria-modal="true" aria-label="공유"><p>공유 대상을 고르세요</p><button id="mui-close" type="button">닫기</button></div></div>
<div id="late-dlg" role="dialog" aria-modal="true" aria-label="이름 바꾸기" hidden><input id="late-in" aria-label="새 이름"><button id="late-close" type="button">닫기</button></div>
<script>
  // what-input's rules: modifier keys (Shift, Ctrl, Alt, Meta, menu) do not switch to
  // keyboard, and the attribute is written when the script's own mode changes.
  const IGNORE = [16, 17, 18, 91, 93];
  let mode = null;
  const setMode = (m) => { if (m !== mode) { mode = m; document.documentElement.dataset.whatinput = m; } };
  document.addEventListener('keydown', (e) => { if (!IGNORE.includes(e.keyCode)) setMode('keyboard'); }, true);
  document.addEventListener('mousedown', () => setMode('mouse'), true);
  const $ = (id) => document.getElementById(id);
  let n = 0;
  // Ticks until the button is clicked (later steps measure feedback).
  const tick = setInterval(() => { $('tick-n').textContent = String(++n); }, 400);
  $('tick-btn').addEventListener('click', () => clearInterval(tick));
  customElements.define('fancy-button', class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open', delegatesFocus: true }).innerHTML = '<button type="button" style="padding: 4px 10px">공유 링크</button>';
    }
  });
  $('menu2-btn').addEventListener('click', () => {
    $('menu2').hidden = false;
    $('menu2-btn').setAttribute('aria-expanded', 'true');
    $('mi-1').focus();
  });
  const closeMenu = () => { $('menu2').hidden = true; $('menu2-btn').setAttribute('aria-expanded', 'false'); };
  for (const id of ['mi-1', 'mi-2']) $(id).addEventListener('click', () => { closeMenu(); $('menu2-btn').focus(); document.title = `선택 ${id}`; });
  $('menu2').addEventListener('focusout', (e) => { if (!$('menu2').contains(e.relatedTarget)) closeMenu(); });
  $('card').addEventListener('click', () => $('card').classList.toggle('on'));
  $('card2').addEventListener('click', () => $('card2').classList.toggle('on'));
  $('fill-btn').addEventListener('pointerdown', (e) => e.preventDefault()); // keep focus in the field
  $('fill-btn').addEventListener('click', () => { $('fill').value = String(Number($('fill').value || 0) + 10000); });
  $('dock-btn').addEventListener('click', () => { $('dock-drawer').hidden = false; });
  $('dock-close').addEventListener('click', () => { $('dock-drawer').hidden = true; });
  $('fake-radio').addEventListener('click', () => $('fake-radio').classList.toggle('on'));
  $('disc-btn').addEventListener('click', () => { $('disc').hidden = !$('disc').hidden; });
  $('mui-btn').addEventListener('click', () => { $('mui-root').hidden = false; $('mui-root').focus(); });
  $('mui-close').addEventListener('click', () => { $('mui-root').hidden = true; $('mui-btn').focus(); });
  $('late-btn').addEventListener('click', () => { $('late-dlg').hidden = false; setTimeout(() => $('late-in').focus(), 600); });
  $('late-close').addEventListener('click', () => { $('late-dlg').hidden = true; $('late-btn').focus(); });
</script>
</body>
</html>
