<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reflow fixture</title>
<!--
  Reflow pass fixture (driver self-test): #fixed-box is 400 px wide and must be found
  at 320 px; #fee-table (a table) and #chips (its own horizontal scroll box) are
  two-dimensional or self-scrolling and exempt; #fluid fits. Pressing #next shows a
  second screen whose #wide-note is 380 px wide: the pass must keep both screens.
  #bar-timer fits at 360 px but is cut by #bar at 320 px (lost); #slide-2 is hidden by
  its carousel at both widths (not lost); #chip-t is cut by its fixed-width label
  (LY-01, ancestor clipping). #shell-note sits 600 px down a 90vh shell with
  overflow:hidden: it shows at the device height and must not count as lost because a
  shorter zoomed viewport would hide it (only the narrower width counts).
-->
<style>
  body { margin: 0; font-family: sans-serif; }
  #fixed-box { width: 400px; padding: 8px; background: #eef; }
  #fee-table { border-collapse: collapse; }
  #fee-table td { padding: 4px 40px; white-space: nowrap; }
  #chips { overflow-x: auto; white-space: nowrap; }
  #chips span { display: inline-block; width: 120px; margin-right: 8px; background: #efe; }
  #fluid { max-width: 100%; }
  #wide-note { width: 380px; background: #fee; }
  #bar { display: flex; white-space: nowrap; overflow: hidden; background: #ddd; }
  #bar span { flex: none; }
  #bar-title { width: 296px; }
  #bar-timer { width: 60px; }
  #carousel { overflow: hidden; white-space: nowrap; width: 300px; }
  #carousel div { display: inline-block; width: 300px; }
  #shell { height: 90vh; overflow: hidden; }
  #shell-pad { height: 600px; }
  #chip-l { display: inline-block; width: 80px; overflow: hidden; white-space: nowrap; border: 1px solid #999; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="bar"><span id="bar-title">최종평가 응답 3/5</span><span id="bar-timer">남은 09:41</span></div>
<div id="carousel"><div id="slide-1">첫 번째 배너</div><div id="slide-2">두 번째 배너</div></div>
<label id="chip-l"><input type="radio" name="s"><span id="chip-t">매운 양념 +500원</span></label>
<div id="step1">
  <div id="fixed-box">수수료 합계 3,000원 (등기 우편 포함)</div>
  <table id="fee-table"><tr><td>등본</td><td>1,000원</td><td>우편</td><td>2,000원</td></tr></table>
  <div id="chips"><span>일반</span><span>빠른</span><span>등기</span><span>택배</span></div>
  <p id="fluid">줄바꿈되는 안내 문장입니다. 좁은 화면에서도 가로로 넘치지 않습니다.</p>
  <button id="next" type="button">다음</button>
</div>
<div id="step2" hidden>
  <p id="wide-note">두 번째 화면의 고정 폭 안내문</p>
</div>
<div id="shell"><div id="shell-pad"></div><p id="shell-note">셸 아래쪽 안내</p></div>
<script>
  document.getElementById('next').addEventListener('click', () => {
    document.getElementById('step1').hidden = true;
    document.getElementById('step2').hidden = false;
  });
</script>
</body>
</html>
