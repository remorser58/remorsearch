<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layers selftest</title>
<!--
  Driver self-test for layer-dependent measurements:
  - #wfield is an opaque white input on a #fffbe6 card: container_bg must be #fffbe6.
  - #covered-btn sits under #cover (absolute, translucent): occluded_fraction 1, occluded_by #cover.
  - #li-owner has no text node of its own (its text is in #li-btn at 20px): not listed.
  - After #open-modal, the <dialog> is modal: #behind is inert_by_modal, #in-modal is not.
-->
<style>
  body { margin: 0; font-family: sans-serif; background: #f2f4f6; }
  #wcard { background: #fffbe6; padding: 12px; margin: 8px; }
  #wfield { background: #ffffff; border: 1px solid #8b95a1; height: 40px; width: 200px; font-size: 16px; }
  #cover-host { position: relative; height: 48px; margin: 8px; }
  #covered-btn { height: 48px; width: 160px; font-size: 16px; }
  #cover { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); }
  ul { margin: 8px; }
  #li-btn { font-size: 20px; height: 44px; }
  #behind, #open-modal { height: 44px; margin: 8px; font-size: 16px; }
  dialog { padding: 16px; }
  #in-modal { height: 44px; font-size: 16px; }
</style>
</head>
<body>
  <div id="wcard"><input id="wfield" type="text" aria-label="이름"></div>
  <div id="cover-host"><button id="covered-btn" type="button">가려진 버튼</button><div id="cover"></div></div>
  <ul><li id="li-owner"><button id="li-btn" type="button">옵션 하나</button></li></ul>
  <div id="stage-host" style="position:relative;height:60px;margin:8px"><canvas id="stage" width="300" height="60" style="position:absolute;inset:0;width:100%;height:60px;background:#123"></canvas><div id="hud" style="position:absolute;left:8px;top:8px;color:#fff;pointer-events:none;font-size:16px">점수 0</div></div>
  <div id="card" style="position:relative;margin:8px;padding:8px;background:#fff"><p id="card-text" style="color:#bbb;margin:0">카드 안 흐린 설명 글자</p><a id="card-link" href="#" style="position:absolute;inset:0"></a></div>
  <button id="behind" type="button">뒤쪽 버튼</button>
  <button id="open-modal" type="button">열기</button>
  <dialog id="dlg"><p id="dlg-text">모달 안내 문구입니다</p><button id="in-modal" type="button">확인</button></dialog>
  <script>
    document.getElementById('open-modal').addEventListener('click', () => document.getElementById('dlg').showModal());
  </script>
</body>
</html>
